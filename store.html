    <script>
    (function () {
        // YOUR PRODUCTS, in the order they appear on the page.
        // To add a product: in Shopify, create a Buy Button for it, copy the
        // number after  id: '  in the code Shopify gives you, and add it here.
        var productIds = [
            '11335320306005',
            '11336558608725',
            '11341224608085',
            '11341225001301',
            '11344609935701',
            '11344629629269',
            '11346461294933',
            '11346428461397',
            '11353880658261',
            '11354222625109',
            '11342720106837',
            '11342719779157'
        ];

        // ---------- Look of the products, pop-up and cart ----------
        var FONT = '"Libre Caslon Text", Georgia, serif';
        var FONTS = ['Libre Caslon Text:400,400i'];
        var INK = '#1a1a1a';
        var SOFT = 'rgba(26, 26, 26, 0.68)';

        var buttonStyle = {
            'font-family': FONT,
            'font-size': '15px',
            'letter-spacing': '0.08em',
            'width': '100%',
            'padding-top': '14px',
            'padding-bottom': '14px',
            'padding-left': '20px',
            'padding-right': '20px',
            'color': '#ecebe7',
            'background-color': INK,
            ':hover': { 'background-color': '#3a3a3a' },
            ':focus': { 'background-color': '#3a3a3a' },
            'border-radius': '0px'
        };

        var quantityStyle = {
            'font-family': FONT,
            'font-size': '15px',
            'padding-top': '14px',
            'padding-bottom': '14px',
            'border-radius': '0px'
        };

        var options = {
            product: {
                styles: {
                    product: { 'text-align': 'center' },
                    title: {
                        'font-family': FONT,
                        'font-size': '17px',
                        'font-weight': 'normal',
                        'letter-spacing': '0.03em',
                        'color': INK,
                        'margin-top': '18px'
                    },
                    prices: { 'margin-bottom': '14px' },
                    options: { 'max-width': '100% !important' },   // size menu as wide as the button
                    price: { 'font-family': FONT, 'font-size': '15px', 'color': SOFT },
                    compareAt: { 'font-family': FONT, 'font-size': '13px', 'color': SOFT },
                    unitPrice: { 'font-family': FONT, 'font-size': '13px', 'color': SOFT },
                    button: buttonStyle,
                    buttonWrapper: { 'margin-top': '12px' },
                    quantityInput: quantityStyle
                },
                width: '100%',          // fills its column; the page decides the columns
                googleFonts: FONTS,
                text: { button: 'Add to cart' }
            },
            // The pop-up that opens when someone clicks a product
            modalProduct: {
                contents: {
                    img: false,
                    imgWithCarousel: true,
                    button: false,
                    buttonWithQuantity: true
                },
                styles: {
                    product: {
                        '@media (min-width: 601px)': {
                            'max-width': '100%',
                            'margin-left': '0px',
                            'margin-bottom': '0px'
                        }
                    },
                    title: { 'font-family': FONT, 'font-weight': 'normal', 'font-size': '26px', 'letter-spacing': '0.03em', 'color': INK },
                    price: { 'font-family': FONT, 'font-weight': 'normal', 'font-size': '17px', 'color': SOFT },
                    compareAt: { 'font-family': FONT, 'font-weight': 'normal', 'font-size': '15px', 'color': SOFT },
                    unitPrice: { 'font-family': FONT, 'font-weight': 'normal', 'font-size': '14px', 'color': SOFT },
                    description: { 'font-family': FONT, 'font-size': '15px', 'line-height': '1.7', 'color': INK },
                    button: buttonStyle,
                    quantityInput: quantityStyle
                },
                googleFonts: FONTS,
                text: { button: 'Add to cart' }
            },
            option: {
                styles: {
                    label: { 'font-family': FONT, 'font-size': '14px', 'color': SOFT },
                    wrapper: { 'border': '1px solid rgba(26, 26, 26, 0.35)', 'border-radius': '0px', 'background-color': 'transparent' },
                    select: { 'font-family': FONT, 'font-size': '15px', 'color': INK, 'padding-top': '11px', 'padding-bottom': '11px' }
                }
            },
            cart: {
                styles: {
                    title: { 'font-family': FONT, 'font-weight': 'normal', 'color': INK },
                    header: { 'color': INK },
                    lineItems: { 'font-family': FONT, 'color': INK },
                    subtotalText: { 'font-family': FONT, 'color': INK },
                    subtotal: { 'font-family': FONT, 'color': INK },
                    notice: { 'font-family': FONT, 'color': SOFT },
                    currency: { 'font-family': FONT, 'color': SOFT },
                    empty: { 'font-family': FONT, 'color': SOFT },
                    close: { 'color': INK, ':hover': { 'color': INK } },
                    button: buttonStyle
                },
                text: { title: 'Your cart', total: 'Subtotal', button: 'Checkout' },
                popup: false,
                googleFonts: FONTS
            },
            lineItem: {
                styles: {
                    itemTitle: { 'font-family': FONT, 'color': INK },
                    variantTitle: { 'font-family': FONT, 'color': SOFT },
                    price: { 'font-family': FONT, 'color': INK },
                    fullPrice: { 'font-family': FONT, 'color': SOFT },
                    quantityInput: { 'font-family': FONT }
                }
            },
            // The small "cart" tab on the right edge of the screen
            toggle: {
                styles: {
                    toggle: {
                        'font-family': FONT,
                        'background-color': INK,
                        ':hover': { 'background-color': '#3a3a3a' },
                        ':focus': { 'background-color': '#3a3a3a' }
                    },
                    count: { 'font-size': '16px' }
                },
                googleFonts: FONTS
            }
        };

        var store = document.getElementById('store');

        // Load Shopify's script once, then add every product
        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://sdks.shopifycdn.com/buy-button/latest/buy-button-storefront.min.js';
        script.onload = function () {
            var client = ShopifyBuy.buildClient({
                domain: 'vitzizka.myshopify.com',
                storefrontAccessToken: 'db54fdafdd88a985dd955f6628e26b88'
            });
            ShopifyBuy.UI.onReady(client).then(function (ui) {
                productIds.forEach(function (id) {
                    var node = document.createElement('div');
                    store.appendChild(node);
                    ui.createComponent('product', {
                        id: id,
                        node: node,
                        moneyFormat: '%24%7B%7Bamount%7D%7D',
                        options: JSON.parse(JSON.stringify(options))
                    });
                });
            });
        };
        document.head.appendChild(script);
    })();
    </script>
