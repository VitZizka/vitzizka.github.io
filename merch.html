     /* The Desktop Layout */
        .merch-container {
            width: 100%;
            max-width: 900px;
            min-height: 55vh; 
            margin: 0 auto 3.5rem auto; 
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* This creates exactly two side-by-side columns */
            gap: 3rem; 
            justify-items: center; /* This keeps each shirt perfectly centered in its own column */
        }

        /* The Mobile Layout */
        @media (max-width: 768px) {
            .merch-container {
                grid-template-columns: 1fr; /* This forces it down to exactly one column on phones */
                gap: 5rem; /* Keeps a nice breathing room between the vertically stacked items */
            }
        }

        .nav-links {
            margin: 0 0 1.5rem 0;
            display: flex;
            justify-content: center;
            gap: 2rem;
        }

        .nav-links a {
            color: #1a1a1a;
            text-decoration: none;
            font-size: 1.15rem;
            font-weight: normal;
            letter-spacing: 0.2em;
            transition: opacity 0.1s ease;
        }

        .nav-links a:hover { opacity: 0.5; }

        .social-icons {
            display: flex;
            gap: 1.2rem;
            align-items: center;
            justify-content: center;
        }

        .social-icons a {
            color: #1a1a1a;
            display: inline-block;
            transition: opacity 0.1s ease;
        }

        .social-icons a:hover { opacity: 0.5; }
        .social-icons svg { width: 18px; height: 18px; fill: currentColor; display: block; }
